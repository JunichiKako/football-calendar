name: 試合日程スナップショットの更新

# 1日2回、football-data.org から全リーグのシーズン全日程を取得して
# data/snapshot.json を更新する。差分があるときだけコミットする。
#
# アプリが表示のたびにAPIを叩かなくて済むようにするのが目的。
# あわせて、コミット履歴がそのまま「いつ日程が変わったか」の記録になる。
on:
  schedule:
    # 20:00 UTC (05:00 JST) と 08:00 UTC (17:00 JST)
    - cron: '0 20,8 * * *'
  workflow_dispatch:

# 同時実行を防ぐ。手動実行とcronが重なるとpushが競合するため
concurrency:
  group: update-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: スナップショットを取得
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: node scripts/fetch-snapshot.mjs

      # 昇格チームが入ると日本語表記が無いまま英語で表示されてしまう。
      # データ自体は正しいのでコミットは続行し、警告だけ残す。
      - name: チーム名の日本語表記を確認
        continue-on-error: true
        run: npm test

      - name: 差分があればコミット
        run: |
          if git diff --quiet -- data/snapshot.json; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi

          # 変更内容をコミットメッセージに残す。
          # 「配信更新」は seq が上がったもの＝購読者に届く変更だけを数える。
          summary=$(node scripts/summarize-changes.mjs)

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json
          git commit -m "chore: 試合日程を更新 - ${summary}"
          git push
