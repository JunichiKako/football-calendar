name: 試合日程スナップショットの更新

# 1日2回、football-data.org から全リーグのシーズン全日程を取得して
# data/snapshot.json を更新する。差分があるときだけコミットする。
#
# アプリが表示のたびにAPIを叩かなくて済むようにするのが目的。
# あわせて、コミット履歴がそのまま「いつ日程が変わったか」の記録になる。
on:
  schedule:
    # 20:00 UTC (05:00 JST) と 08:00 UTC (17:00 JST)
    - cron: '0 20,8 * * *'
  workflow_dispatch:

# 同時実行を防ぐ。手動実行とcronが重なるとpushが競合するため
concurrency:
  group: update-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: スナップショットを取得
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: node scripts/fetch-snapshot.mjs

      - name: 差分があればコミット
        run: |
          if git diff --quiet -- data/snapshot.json; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi

          # 何試合が増減したかをコミットメッセージに残す
          summary=$(node -e "
            const fs = require('node:fs');
            const { execSync } = require('node:child_process');
            const now = JSON.parse(fs.readFileSync('data/snapshot.json', 'utf-8'));
            const before = JSON.parse(execSync('git show HEAD:data/snapshot.json').toString());
            const count = (s) => s.leagues.reduce((n, l) => n + l.matches.length, 0);
            const key = (s) => new Map(s.leagues.flatMap(l => l.matches.map(m => [m.id, m])));
            const a = key(before), b = key(now);
            const added = [...b.keys()].filter(id => !a.has(id)).length;
            const removed = [...a.keys()].filter(id => !b.has(id)).length;
            const changed = [...b.entries()].filter(([id, m]) =>
              a.has(id) && (a.get(id).utcDate !== m.utcDate || a.get(id).status !== m.status)
            ).length;
            const parts = [];
            if (added) parts.push(\`追加 \${added}\`);
            if (removed) parts.push(\`削除 \${removed}\`);
            if (changed) parts.push(\`変更 \${changed}\`);
            console.log(\`\${count(now)}試合 (\${parts.join(' / ') || '内容の更新'})\`);
          ")

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json
          git commit -m "chore: 試合日程を更新 - ${summary}"
          git push
